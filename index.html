<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lydia &amp; Rueben — 27 December 2026</title>
    <meta name="description" content="The roora of Lydia R. Fambarega and Rueben Chaibva. Sunday 27 December 2026, Bulawayo." />
    <meta property="og:title" content="Lydia &amp; Rueben — 27 December 2026" />
    <meta property="og:description" content="You are invited to our roora in Bulawayo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Static copy of the RSVP form. Netlify's build bot scans the shipped HTML to
      register a form; it does not execute React, so without this it finds nothing.
      Hidden from users and assistive tech. Field names must match RsvpForm.jsx.
    -->
    <form name="rsvp" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="attending" />
      <input type="number" name="guests" />
      <input type="text" name="diet" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <main id="root"></main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
